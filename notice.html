<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notice Panel | LS Tuition</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1a13">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manjari:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="back-btn-row reveal">
    <a href="index.html" class="back-btn">&larr; Back to Panel</a>
  </div>

  <div class="brand reveal">
    <div class="brand-row">
      <img src="icon-192.png" alt="LS Tuition crest">
      <div class="brand-text">
        <h1>LS Tuition</h1>
        <div class="tagline">Notice Panel</div>
      </div>
    </div>
  </div>

  <div class="admin-stack">
    <div class="sheet reveal">
    <div class="sheet-top"></div>
    <div class="sheet-inner">
      <h2 class="section-title">Publish Notice</h2>
      <form id="noticeForm">
        <div class="field field-standalone">
          <label for="noticeTitle">Notice Title</label>
          <input type="text" id="noticeTitle" required placeholder="e.g., Exam Postponed">
        </div>
        <div class="field">
          <label for="noticeDesc">Notice Details</label>
          <textarea id="noticeDesc" rows="3" placeholder="Enter details here..."></textarea>
        </div>
        <button type="submit" class="submit" id="noticeSubmitBtn">Publish Notice</button>
      </form>
    </div>
    </div>
  </div>

<footer class="reveal">© LS Tuition — Result records are stored securely on Firebase</footer>

  <div id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

  <script type="module">
    import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { db } from "./firebase-init.mjs";

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.error('Service worker registration failed:', err);
        });
      });
    }

    const revealEls = document.querySelectorAll('.reveal');
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    revealEls.forEach((el) => revealObserver.observe(el));

    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    function showToast(msg, kind){
      toast.className = kind;
      toastMsg.textContent = msg;
      requestAnimationFrame(() => toast.classList.add('show', kind));
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), 3200);
    }

    const noticeForm = document.getElementById('noticeForm');
    const noticeSubmitBtn = document.getElementById('noticeSubmitBtn');

    noticeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('noticeTitle').value.trim();
      const desc = document.getElementById('noticeDesc').value.trim();

      if (!title) return;

      noticeSubmitBtn.disabled = true;
      noticeSubmitBtn.textContent = 'Publishing…';

      try {
        await addDoc(collection(db, 'notices'), {
          title: title,
          description: desc,
          timestamp: serverTimestamp()
        });
        noticeForm.reset();
        showToast('അറിയിപ്പ് വിജയകരമായി പോസ്റ്റ് ചെയ്തു! 🎉', 'ok');
      } catch (error) {
        console.error('Error publishing notice: ', error);
        showToast('നോട്ടീസ് അയക്കാൻ സാധിച്ചില്ല.', 'err');
      } finally {
        noticeSubmitBtn.disabled = false;
        noticeSubmitBtn.textContent = 'Publish Notice';
      }
    });
  </script>
</body>
</html>
